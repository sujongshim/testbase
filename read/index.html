<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 쪽 독서</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --ink:#22211F; --muted:#67655F; --line:#E2DDD2;
  --accent:#3F5E8C; --accent-soft:#DDE5F1; --done:#2F7D45; --done-soft:#DCEFE1; --rest:#8A6D3B; --rest-soft:#F1E7D3; --focus:#2F5FD0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141414; --surface:#1D1D1C; --ink:#ECEAE5; --muted:#A3A09A; --line:#2F2E2B;
  --accent:#8FAEDD; --accent-soft:#1F2A3B; --done:#74CF8C; --done-soft:#1E3A26; --rest:#D9B97A; --rest-soft:#3A2F1C; --focus:#8AA8FF; } }
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1D1D1C; --ink:#ECEAE5; --muted:#A3A09A; --line:#2F2E2B;
  --accent:#8FAEDD; --accent-soft:#1F2A3B; --done:#74CF8C; --done-soft:#1E3A26; --rest:#D9B97A; --rest-soft:#3A2F1C; --focus:#8AA8FF; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
.copyright{text-align:center;font-size:.78rem;color:var(--muted);margin:0 0 14px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.d{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400}
.serif{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif}
main{max-width:520px;margin:0 auto;padding:12px 12px 40px}
@media (min-width:860px){ main{max-width:680px;padding:28px 24px 56px} }
h1{font-size:1rem;color:var(--muted);font-weight:500;margin:0 0 8px}
h2{font-size:1.15rem;margin:0 0 8px}
section{margin-top:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.panel{background:var(--surface);border-radius:14px;padding:12px}
[hidden]{display:none !important}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:12px;padding:3px;gap:3px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;box-shadow:0 1px 0 var(--line)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 0;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;margin-top:12px}
.hero svg{width:96px;height:auto;display:block}
.daynav{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.daynav button{border:1px solid var(--line);background:transparent;border-radius:8px;width:30px;height:28px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.big{font-size:1.9rem;line-height:1.1;margin:2px 0}
.msg{font-size:.86rem;margin:0}
.streak{display:inline-flex;gap:6px;margin-top:6px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600}

.book{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--surface);border-radius:14px;padding:12px;margin-top:8px}
.cover{width:52px;height:74px;border-radius:4px 7px 7px 4px;color:#fff;font-size:.7rem;line-height:1.25;padding:6px 5px 5px 8px;overflow:hidden;position:relative;box-shadow:inset 3px 0 0 rgba(0,0,0,.18);word-break:keep-all}
.btitle{font-weight:600;line-height:1.3}
.bauthor{font-size:.82rem;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:4px}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.b{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:.86rem;font-weight:500}
.b.fill{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.b.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.pageinput{display:flex;gap:6px;align-items:center;margin-top:10px}
.field{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.9rem;min-width:0;width:100%}
textarea.field{resize:vertical;min-height:64px}
.btn{white-space:nowrap;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:.92rem}
.btn.primary{background:var(--ink);color:var(--bg)} .btn.ghost{background:var(--bg)} .btn.rest{background:var(--rest-soft);color:var(--rest)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.restrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:.84rem}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:14px}

.shelfnav{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:1.5rem;cursor:pointer;padding:0 2px;color:var(--line)}
.stars button.on{color:#E0A526}
.form{display:grid;gap:8px}
.form label{display:grid;gap:3px;font-size:.84rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.quote{background:var(--surface);border-radius:14px;padding:14px;margin-top:8px}
.quote .q{font-size:1.02rem;line-height:1.7;margin:0}
.quote .t{font-size:.86rem;margin:8px 0 0;padding-left:10px;border-left:3px solid var(--accent-soft)}
.quote .src{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.78rem;color:var(--muted)}
.spot{background:var(--accent-soft)}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:2px 6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px}
.stat .v{font-size:1.35rem;line-height:1.2}
.cal{background:var(--surface);border-radius:14px;padding:12px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead button{border:1px solid var(--line);background:transparent;border-radius:8px;width:30px;height:28px;cursor:pointer}
.calhead button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.grid .wd{font-size:.72rem;color:var(--muted)}
.cell{width:100%;min-width:0;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.78rem;background:var(--bg);border:0;padding:0;color:var(--muted)}
.cell.done{background:var(--done);color:#fff;font-weight:600}
.cell.part{background:var(--done-soft);color:var(--done)}
.cell.rest{background:var(--rest-soft);color:var(--rest)}
.cell.now{outline:2px solid var(--ink);outline-offset:-2px}
.cell.pick{cursor:pointer}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.yearbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.yearbar i{display:block;height:100%;background:var(--done);border-radius:99px}
.filepick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.warnbox{background:var(--surface);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.85rem}
.setup{background:var(--surface);border-radius:18px;padding:16px}
.photobtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:.88rem;cursor:pointer}
.pbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.qphoto{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--line);border:0;padding:0;cursor:zoom-in}
.qphoto img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:block;min-height:60px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.micwrap{position:relative}
.micwrap textarea,.micwrap input{padding-right:52px}
.mic{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-size:1.15rem;cursor:pointer;display:grid;place-items:center}
.mic.on{background:#D93A2B;color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,58,43,.45)}50%{box-shadow:0 0 0 8px rgba(217,58,43,0)}}
@media (prefers-reduced-motion:reduce){ .mic.on{animation:none} }
.notebtn{display:block;width:100%;margin-top:10px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:10px;font-weight:600;font-size:.92rem;cursor:pointer}
.notebtn.on{border-style:solid;background:var(--accent-soft)}
.bigmic{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--accent);color:#fff}
.bigmic.on{background:#D93A2B;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ .bigmic.on{animation:none} }
.miclive{font-size:.8rem;color:#D93A2B;margin:4px 2px 0;min-height:1.2em}
.cardmodal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.cardsheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.cardsheet img{width:100%;height:auto;border-radius:10px;display:block;background:var(--line);aspect-ratio:4/5}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-top:10px}
.check input{width:18px;height:18px}
.mode{font-size:.78rem;color:var(--muted);text-align:center;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 28px);font-size:.9rem;z-index:5}
.toast[hidden]{display:none}
.toast button{white-space:nowrap;background:transparent;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .35s ease} #ring{transition:stroke-dashoffset .5s ease} }
</style>
</head>
<body>
<main>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 14px">
    <p class="copyright" style="margin:0">© 2026 심수정 · All rights reserved.</p>
    <span style="display:flex;gap:12px;align-items:center"><button type="button" id="langBtn" style="border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;cursor:pointer;font-size:.78rem;padding:2px 10px;white-space:nowrap">English</button><button type="button" id="resetBtn" style="border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.78rem;padding:2px;white-space:nowrap">다시 시작하기</button></span>
  </div>
  <div id="app">
    <h1>한 쪽 독서</h1>
    <nav class="tabs" id="tabs" aria-label="화면"></nav>
    <div id="notices"></div>

    <div id="v-today"></div>
    <div id="v-shelf" hidden></div>
    <div id="v-notes" hidden></div>
    <div id="v-stats" hidden></div>

    <p class="mode" id="mode"></p>
    <p style="text-align:center;margin:14px 0 0;font-size:.82rem"><a href="../" style="color:var(--muted)">← 소확앱 다른 앱 보기</a></p>
  </div>
</main>
<div class="viewer" id="viewer" hidden role="dialog" aria-label="사진 크게 보기"><img id="viewerImg" alt="구절 사진"></div>
<div class="cardmodal" id="cardModal" hidden role="dialog" aria-label="구절 이미지 만들기"><div class="cardsheet" id="cardSheet"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" hidden>되돌리기</button></div>

<script>
(function(){
  const KEY = 'one-page-reading-v1';
  const PASSES = 2, BACKDAYS = 7;
  const COVERS = ['#3F5E8C','#8C3F5E','#2F6B4F','#8A6D3B','#5B4A8C','#A0522D','#2E6B7A','#6B6B2E'];
  const st = {setup:false, goal:{monthly:1, yearly:12}, goalOpen:false, time:{}, timer:0, books:[], notes:[], lastBackup:0,
    tab:'today', day:null, notesForm:false, noteBook:null, ocrBusy:false, shelf:'want', editBook:null, addOpen:false, storageOk:true};
  let toastTimer = null, undoFn = null, resetArmed = false, resetTimer = null;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const today = () => ymd(new Date());
  const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
  const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const int = v => Math.max(0, Math.floor(Number(v)||0));
  const L = s => window.__sohwakTr ? window.__sohwakTr(s) : s;
  const dayLabel = s => { const d = parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; };
  const hash = s => { let h = 0; for(const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; };
  const coverHtml = b => `<div class="cover serif" style="background:${COVERS[hash(b.title)%COVERS.length]}" aria-hidden="true">${esc(b.title.slice(0,18))}</div>`;
  const book = id => st.books.find(b => b.id===id);

  // ---------- storage ----------
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({v:1, setup:st.setup, goal:st.goal, time:st.time, timer:st.timer, books:st.books, notes:st.notes, lastBackup:st.lastBackup})); st.storageOk = true; }
    catch(e){ st.storageOk = false; toast('이 브라우저에 저장하지 못했어요. 백업 파일을 받아 두세요.'); }
  }
  function load(){
    try{
      localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t');
      const d = JSON.parse(localStorage.getItem(KEY)||'null');
      if(d){ Object.assign(st, {setup:!!d.setup, goal:{monthly:int(d.goal&&d.goal.monthly)||1, yearly:int(d.goal&&d.goal.yearly)||12}, books:(d.books||[]).map(b => b.status==='reading' ? Object.assign(b,{status:'want'}) : b), notes:d.notes||[], time:d.time||{}, timer:Number(d.timer)||0, lastBackup:d.lastBackup||0}); }
    }catch(e){ st.storageOk = false; }
  }

  // ---------- actions ----------
  // reading timer: start/stop, seconds accumulated per day (split at midnight)
  const fmtDur = sec => { sec = Math.floor(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60); return h ? `${h}시간 ${m}분` : m ? `${m}분` : `${sec}초`; };
  const fmtClock = sec => { sec = Math.max(0, Math.floor(sec)); return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; };
  const timeToday = () => (st.time[today()]||0) + (st.timer ? Math.max(0, (Date.now()-st.timer)/1000) : 0);
  function timerToggle(){
    if(!st.timer){ st.timer = Date.now(); save(); render(); toast('읽기를 시작했어요. 다 읽으면 끝내기를 눌러요 ⏱️'); return; }
    let a = st.timer; const b = Date.now(); st.timer = 0;
    if(b - a < 5000){ save(); render(); toast('5초보다 짧아서 기록하지 않았어요.'); return; }
    while(a < b){ const d = new Date(a), next = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1).getTime(), e = Math.min(b, next), k = ymd(d); st.time[k] = (st.time[k]||0) + (e-a)/1000; a = e; }
    for(const k in st.time) st.time[k] = Math.round(st.time[k]);
    save(); render(); toast(`오늘 ${fmtDur(st.time[today()]||0)} 읽었어요 📖`);
  }
  setInterval(() => { const el = document.getElementById('timerNow'); if(el && st.timer) el.textContent = fmtClock((Date.now()-st.timer)/1000); }, 1000);
  const doneIn = prefix => st.books.filter(b => b.status==='done' && (b.end||'').startsWith(prefix)).length;
  function finishBook(id, rating, review){
    const b = book(id); if(!b) return;
    b.status = 'done'; b.end = b.end || today(); b.rating = rating||0; b.review = (review||'').trim().slice(0,140);
    st.editBook = null; st.shelf = 'done'; save(); render();
    toast(`완독했어요! 이번 달 ${doneIn(today().slice(0,7))}권, 올해 ${doneIn(today().slice(0,4))}권 📚`);
  }
  function addBook(f){
    const title = f.title.trim(); if(!title){ toast('제목을 적어 주세요.'); return false; }
    const done = f.status==='done';
    st.books.push({id:uid(), title:title.slice(0,60), author:(f.author||'').trim().slice(0,40), status:done?'done':'want', end:done?today():'', rating:0, review:'', added:today()});
    save(); return true;
  }
  function removeBook(id){
    const b = book(id); if(!b) return;
    if(!confirm(L(`'${b.title}'을(를) 책장에서 뺄까요? 이 책의 구절도 함께 지워져요.`))) return;
    st.notes.filter(n => n.bookId===id && n.photo).forEach(n => delPhoto(n.id));
    st.books = st.books.filter(x => x.id!==id); st.notes = st.notes.filter(n => n.bookId!==id); st.editBook = null; save(); render(); toast('책장에서 뺐어요.');
  }  // ---------- voice input (Web Speech API) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null, recTarget = null, recBase = '', recFinal = '';
  function stopMic(){ if(rec){ try{ rec.stop(); }catch(e){} } }
  function micUi(on){
    document.querySelectorAll('[data-mic]').forEach(b => { const active = on && b.dataset.mic===recTarget; b.classList.toggle('on', active);
      if(b.classList.contains('bigmic')) b.textContent = active ? '■ 다 읽었으면 눌러서 멈추기' : '🎤 말하면 글자로 적혀요';
      else { b.setAttribute('aria-label', active ? '말로 입력 멈추기' : '말로 입력'); b.textContent = active ? '■' : '🎤'; } });
  }
  function startMic(targetId){
    if(!SR){ toast('이 화면에서는 말로 적기가 안 돼요. 크롬이나 사파리에서 직접 열거나, 키보드의 🎤 버튼을 써 주세요.'); return; }
    if(rec){ const same = recTarget===targetId; stopMic(); if(same) return; }
    const el = $(targetId); if(!el) return;
    recTarget = targetId; recBase = el.value ? el.value.replace(/\s*$/,' ') : ''; recFinal = '';
    rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = e => {
      let interim = '';

  const card = {id:null, theme:'paper', thought:true, blob:null, url:null};
  function wrap(g, text, maxW){
    const lines = [];
    for(const para of String(text).split(/\n/)){
      let line = '';
      for(const word of para.split(/(\s+)/)){
        if(!word) continue;
        const test = line + word;
        if(g.measureText(test).width <= maxW){ line = test; continue; }
        if(line.trim()){ lines.push(line.trim()); line = ''; }
        if(g.measureText(word).width <= maxW){ line = word.trimStart(); continue; }
        for(const ch of word){ if(g.measureText(line+ch).width > maxW){ lines.push(line); line = ch; } else line += ch; }
      }
      lines.push(line.trim());
    }
    return lines.filter((l,i,a) => l || (i>0 && i<a.length-1));
  }
  async function drawCard(){
    const n = st.notes.find(x => x.id===card.id); if(!n) return null;
    const b = book(n.bookId), th = THEMES[card.theme];
    const bg = th.bg || (b ? COVERS[hash(b.title)%COVERS.length] : '#3F5E8C');
    const SERIF = '"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif', SANS = '"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';
    try{ await Promise.all([document.fonts.load(`48px "Gowun Batang"`), document.fonts.load(`30px "IBM Plex Sans KR"`)]); }catch(e){}
    const W = 1080, H = 1350, P = 110, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0,0,W,H);
    g.fillStyle = th.acc; g.font = `180px ${SERIF}`; g.textBaseline = 'alphabetic'; g.fillText('“', P-10, 290);
    const thought = card.thought && n.thought ? n.thought : '';
    const top = 330, bottom = H - 260 - (thought ? 150 : 0);
    let size = 64, lines, lh;
    for(; size >= 34; size -= 2){ g.font = `${size}px ${SERIF}`; lines = wrap(g, n.text, W - P*2); lh = size * 1.62; if(lines.length * lh <= bottom - top) break; }
    const maxLines = Math.floor((bottom - top) / lh);
    if(lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines-1] = lines[maxLines-1].replace(/.{0,2}$/, '…'); }
    const blockH = lines.length * lh, y0 = top + Math.max(0, (bottom - top - blockH) / 2) + size;
    g.fillStyle = th.ink; g.font = `${size}px ${SERIF}`;
    lines.forEach((l,i) => g.fillText(l, P, y0 + i*lh));
    let y = y0 + (lines.length-1)*lh + 110;
    if(thought){
      g.fillStyle = th.acc; g.fillRect(P, y - 34, 6, 70);
      g.fillStyle = th.sub; g.font = `34px ${SANS}`;
      const tl = wrap(g, thought, W - P*2 - 30).slice(0,2); tl.forEach((l,i) => g.fillText(l, P+30, y + i*48));
    }
    g.fillStyle = th.acc; g.fillRect(P, H-210, 80, 4);
    g.fillStyle = th.ink; g.font = `600 36px ${SANS}`;
    g.fillText(b ? b.title : '', P, H-150, W - P*2);
    g.fillStyle = th.sub; g.font = `30px ${SANS}`;
    g.fillText([b && b.author, n.page ? L(n.page+'쪽') : ''].filter(Boolean).join(' · '), P, H-105, W - P*2);
    g.font = `26px ${SANS}`; g.textAlign = 'right'; g.fillText(L('한 쪽 독서'), W-P, H-105); g.textAlign = 'left';

  }

  async function shrink(file, max){

  const barBox = (label, n, goal, sub) => {

      <div class="small muted" style="margin-top:6px">${n>=goal ? '목표 달성! 🎉' : `${goal-n}권 남았어요. (${Math.round(pct)}%)`}${sub||''}</div></div>`;
  };
  function renderToday(){
    const t = today(), mk = t.slice(0,7), y = t.slice(0,4), m = Number(t.slice(5,7));

          <button class="btn ${st.timer?'rest':'primary'}" data-act="timer" style="margin-top:6px">${st.timer ? '■ 다 읽었어요 (끝내기)' : '▶ 읽기 시작'}</button>
        </div>
        ${barBox(`${m}월 목표`, doneM.length, st.goal.monthly)}
        ${barBox(`${y}년 목표`, doneIn(y), st.goal.yearly)}
        ${st.goalOpen ? `<div class="panel form">
          <div style="font-weight:600">이번 달, 올해 책을 몇 권 읽을까요?</div>
          <div class="two"><label>이번 달<input class="field" id="gMonthly" type="number" inputmode="numeric" min="1" value="${st.goal.monthly}"></label>
            <label>올해<input class="field" id="gYearly" type="number" inputmode="numeric" min="1" value="${st.goal.yearly}"></label></div>
          <div class="two"><button class="btn ghost" data-act="closegoal">취소</button><button class="btn primary" data-act="savegoal">목표 저장</button></div></div>`
          : `<div class="btnrow"><button class="btn primary" data-act="opengoal">🎯 목표 설정</button><button class="btn ghost" data-act="addbook">+ 책 추가</button></div>`}
      </section>
      ${doneM.length ? `<section><h2 class="d">이번 달 다 읽은 책</h2>${doneM.map(b => `<div class="book">${coverHtml(b)}<div><div class="btitle">${esc(b.title)}</div><div class="bauthor">${esc(b.author||'')}</div></div></div>`).join('')}</section>` : ''}
      ${hl ? `<section><h2 class="d">오늘 다시 보는 구절</h2>${noteCard(hl, true)}</section>` : ''}`;
  }

  function renderShelf(){
    const S = [['want','읽고 싶은'],['done','다 읽음']];
    const list = st.books.filter(b => b.status===st.shelf).sort((a,b)=> (b.end||b.added||'').localeCompare(a.end||a.added||''));
    const eb = st.editBook ? book(st.editBook) : null;
    $('v-shelf').innerHTML = `<section>
      ${eb ? finishForm(eb) : ''}
      <div class="shelfnav">${S.map(([k,l]) => `<button class="chip" data-shelf="${k}" aria-pressed="${st.shelf===k}">${l} ${st.books.filter(b=>b.status===k).length}</button>`).join('')}
        <button class="chip" data-act="addbook" style="margin-left:auto">+ 책 추가</button></div>
      ${st.addOpen ? addForm() : ''}
      ${list.length ? list.map(b => `<div class="book">${coverHtml(b)}<div>
          <div class="btitle">${esc(b.title)}</div><div class="bauthor">${esc(b.author||'')}</div>
          ${b.status==='done' ? `<div class="small" style="margin-top:4px">${'★'.repeat(b.rating||0)}<span class="muted">${'★'.repeat(5-(b.rating||0))}</span> <span class="muted">${b.end?b.end.slice(5).replace('-','/')+' 완독':''}</span></div>${b.review?`<div class="small serif" style="margin-top:4px">“${esc(b.review)}”</div>`:''}` : ''}
          <div class="brow">
            ${b.status==='want' ? `<button class="b soft" data-finish="${b.id}">다 읽었어요</button>` : `<button class="b" data-finish="${b.id}">평 고치기</button>`}
            <span class="small muted">구절 ${st.notes.filter(n=>n.bookId===b.id).length}</span>
            <button class="del" data-rmbook="${b.id}" aria-label="${esc(b.title)} 빼기" style="margin-left:auto">×</button>
          </div></div></div>`).join('')
        : `<div class="empty">${({want:'읽고 싶은 책을 모아 두세요.',done:'아직 완독한 책이 없어요. 곧 생길 거예요!'})[st.shelf]}</div>`}
    </section>`;
  }
  function addForm(){
    return `<div class="panel form" style="margin:8px 0">
      <label>제목<input class="field" id="aTitle" maxlength="60"></label>
      <div class="two"><label>저자<input class="field" id="aAuthor" maxlength="40"></label>
        <label>상태<select class="field" id="aStatus"><option value="want">읽고 싶은</option><option value="done">다 읽음</option></select></label></div>

  function finishForm(b){

    const list = st.notes, canAdd = true;

  function renderStats(){

          <div class="yearbar" style="flex:1;margin:0;height:10px"><i style="width:${c/mx*100}%"></i></div><span class="small" style="width:3em;text-align:right">${c}권</span></div>`).join('')}

      <section><div class="panel">
        <div class="small muted">읽은 시간 (최근 14일)</div>

        ${days14.map(([k,v]) => `<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="small muted" style="width:3.4em">${k.slice(5).replace('-','/')}</span>
          <div class="yearbar" style="flex:1;margin:0;height:10px"><i style="width:${v/mxs*100}%"></i></div><span class="small" style="width:5.5em;text-align:right">${v ? fmtDur(v) : '-'}</span></div>`).join('')}
      </div></section>
      <section><div class="stats">
        <div class="stat"><div class="small muted">지금까지 다 읽은 책</div><div class="v d">${st.books.filter(b=>b.status==='done').length}권</div></div>
        <div class="stat"><div class="small muted">모은 구절</div><div class="v d">${st.notes.length}개</div></div>
      </div></section>
      <section><div class="panel form">
        <div style="font-weight:600">백업</div>
        <p class="small muted" style="margin:0">기록은 이 휴대폰 브라우저에만 있어요. 가끔 백업 파일을 받아 두세요.</p>
        <div class="btnrow" style="margin-top:0"><button class="btn primary" data-act="backup">백업 파일 받기</button>
          <label class="btn ghost" style="display:inline-block">백업 불러오기<input id="restoreInput" class="filepick" type="file" accept=".json,application/json"></label></div>

  // ---------- events ----------
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(!b) return; st.tab = b.dataset.tab; stopMic(); st.notesForm = false; render(); window.scrollTo(0,0); });
  $('notices').addEventListener('click', e => { if(e.target.closest('[data-act="backup"]')) backup(); });

    if(b = q('[data-mkcard]')){ stopMic(); openCard(b.dataset.mkcard); return; }

    if(b = q('[data-savefinish]')){ finishBook(b.dataset.savefinish, Number($('stars').dataset.r), $('fReview').value); return; }
    if(b = q('[data-rmbook]')){ removeBook(b.dataset.rmbook); return; }
    if(b = q('[data-rmnote]')){ const id = b.dataset.rmnote, n = st.notes.find(x=>x.id===id); st.notes = st.notes.filter(x=>x.id!==id); save(); render();
      let undone = false; undoFn = () => { undone = true; st.notes.unshift(n); save(); render(); };

    if(b = q('[data-copy]')){ const n = st.notes.find(x=>x.id===b.dataset.copy), bk = n && book(n.bookId); const txt = `“${n.text}”\n— ${bk?bk.title:''}${bk&&bk.author?', '+bk.author:''}${n.page?` (${n.page}쪽)`:''}`;

    if(b = q('[data-act]')){ const a = b.dataset.act;

      else if(a==='makeblog') makeBlog();
      else if(a==='copyblog'){ const t = $('blogText').value; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('글을 복사했어요. 블로그에 붙여 넣으세요.')).catch(()=>{ $('blogText').select(); toast('길게 눌러 복사해 주세요.'); }); }
      else if(a==='addbook'){ st.tab = 'shelf'; st.addOpen = true; render(); window.scrollTo(0,0); $('aTitle').focus(); }
      else if(a==='canceladd'){ st.addOpen = false; render(); }
      else if(a==='saveadd'){ const status = $('aStatus').value; if(addBook({title:$('aTitle').value, author:$('aAuthor').value, status})){ st.addOpen = false; st.shelf = status; render(); toast('책장에 넣었어요.'); } }
      else if(a==='cancelfinish'){ st.editBook = null; render(); }
      else if(a==='opengoal'){ st.goalOpen = true; render(); }
      else if(a==='closegoal'){ st.goalOpen = false; render(); }
      else if(a==='savegoal'){ const mo = int($('gMonthly').value), yr = int($('gYearly').value); if(!mo||!yr){ toast('1 이상으로 적어 주세요.'); return; } st.goal = {monthly:mo, yearly:yr}; st.setup = true; st.goalOpen = false; save(); render(); toast('목표를 바꿨어요.'); }
      else if(a==='backup') backup();
      else if(a==='opennoteform'){ st.notesForm = true; render(); }
      else if(a==='closenoteform'){ st.notesForm = false; render(); }
    }
  });
  $('resetBtn').addEventListener('click', () => {
    if(!resetArmed){
      resetArmed = true;
      $('resetBtn').textContent = '정말요? 다시 누르면 전부 지워져요';
      resetTimer = setTimeout(() => { resetArmed = false; $('resetBtn').textContent = '다시 시작하기'; }, 4000);
    } else {
      clearTimeout(resetTimer);
      localStorage.removeItem(KEY);
      location.reload();
    }
  });
  document.querySelector('main').addEventListener('change', e => { if(e.target.id==='restoreInput'){ restore(e.target.files[0]); e.target.value = ''; } else if(e.target.hasAttribute('data-photoin')){ const f = e.target.files[0]; e.target.value = ''; pickPhoto(f); } else if(e.target.hasAttribute('data-blogphoto')){ const f = e.target.files[0]; e.target.value = ''; pickPhoto(f, 'bText', 2000); } });
  $('viewer').addEventListener('click', () => { $('viewer').hidden = true; });
  $('cardModal').addEventListener('click', e => {
    if(e.target.id==='cardModal'){ closeCard(); return; }
    const t = e.target.closest('[data-theme]'); if(t){ card.theme = t.dataset.theme; refreshCard(); return; }
    const a = e.target.closest('[data-card]'); if(a){ if(a.dataset.card==='close') closeCard(); else shareCard(); }
  });
  $('cardModal').addEventListener('change', e => { if(e.target.id==='cardThought'){ card.thought = e.target.checked; refreshCard(); } });
  document.addEventListener('keydown', e => { if(e.key==='Escape'){ if(!$('cardModal').hidden) closeCard(); if(!$('viewer').hidden) $('viewer').hidden = true; } });
  $('toastUndo').addEventListener('click', () => { if(undoFn){ undoFn(); undoFn = null; } $('toast').hidden = true; });
  load(); render();
})();

  };

  ];
  var R = [
    [/(오전|오후) (\d+):(\d+)/g, function(_, ap, h, mi){ return h + ':' + mi + ' ' + (ap==='오전' ? 'AM' : 'PM'); }],
    [/(\d+)\/(\d+)\(([일월화수목금토])\)/g, function(_, a, b, w){ return a + '/' + b + ' (' + WD[w] + ')'; }],

      [/^(\d+)점$/, function(m){ return m[1] + ' stars'; }],
      [/^(\d+)일 (\d+)쪽$/, function(m){ return 'Day ' + m[1] + ': ' + m[2] + ' pages'; }],
      [/^(\d{4})년 완독 목표$/, function(m){ return m[1] + ' finishing goal'; }],
      [/^(\d+) \/ (\d+)권$/, function(m){ return m[1] + ' / ' + m[2] + ' books'; }],
      [/^([\d,]+)쪽 · 구절 (\d+)개$/, function(m){ return m[1] + ' pages · ' + m[2] + ' quotes'; }],
      [/^최근 (\d+)일은 눌러서 고칠 수 있어요$/, function(m){ return 'Tap any of the last ' + m[1] + ' days to edit'; }],
      [/^인상 깊은 구절 ?(.*)$/, function(m){ return 'A memorable quote ' + tr(m[1]); }],
      [/^(.+) 읽음 · (.+)$/, function(m){ return m[0]; }]
    ].concat(P);
  })();

  function tr(s){
    var t = s.trim(); if(!t || !/[가-힣]/.test(t)) return s;
    var r = D[t];
    if(r === undefined){ for(var i=0;i<P.length;i++){ var m = t.match(P[i][0]); if(m){ r = P[i][1](m); break; } } }
    if(r === undefined){ var o = t; for(var j=0;j<R.length;j++) o = o.replace(R[j][0], R[j][1]); if(o !== t) r = o; }
    return r === undefined ? s : s.replace(t, r);
  }
  var ATTRS = ['aria-label','title','placeholder','alt'];
  function fixNode(n){
    var p = n.parentNode; if(!p || /^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)) return;
    if(p.id === 'langBtn') return;
    var v = n.nodeValue;
    if(STRICT_WD && /^\s*[일월화수목금토]\s*$/.test(v) && !(p.classList && p.classList.contains('wd'))) return;
    var r = tr(v); if(r !== v) n.nodeValue = r;
  }
  function fixAttrs(el){
    if(el.id === 'langBtn') return;
    if(el.hasAttribute && el.hasAttribute('data-trv') && document.activeElement !== el){ var cv = el.value, cr = tr(cv); if(cr !== cv) el.value = cr; }
    for(var i=0;i<ATTRS.length;i++){ var a = ATTRS[i]; if(el.hasAttribute && el.hasAttribute(a)){ var v = el.getAttribute(a), r = tr(v); if(r !== v) el.setAttribute(a, r); } }
  }
  function walk(root){
    if(root.nodeType === 3){ fixNode(root); return; }
    if(root.nodeType !== 1) return;
    fixAttrs(root);
    var w = document.createTreeWalker(root, 5), n;
    while((n = w.nextNode())){ if(n.nodeType === 3) fixNode(n); else fixAttrs(n); }
  }
  function enable(){
    document.documentElement.lang = 'en';
    window.__sohwakTr = tr;
    document.title = tr(document.title);
    walk(document.body);
    new MutationObserver(function(ms){
      ms.forEach(function(m){
        if(m.type === 'childList') m.addedNodes.forEach(walk);
        else if(m.type === 'characterData') fixNode(m.target);
        else if(m.type === 'attributes') fixAttrs(m.target);
      });
    }).observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});
  }
  window.__sohwakEn = enable;
  if(en) enable();
})();
</script>
